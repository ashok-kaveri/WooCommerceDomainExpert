display_name: Woo Handoff Docs
short_description: >-
  Makes release handoff docs for approved Woo cards. Builds a Support Guide and/or a
  Business Brief as Markdown and PDF, using the real Trello card details. Can send them
  to Slack when asked.
default_prompt: |
  Make the Woo handoff document I asked for. Follow the woo-handoff-docs skill.

  1. Make only the doc I asked for: Support Guide, Business Brief, or both. If I just ask you to generate the guide without naming a doc type, make one combined Support Guide by default.
  2. Make one combined doc for the whole release. Make a single-card doc only if I name one card.
  3. Read the full Trello card first: description, labels, comments, checklists, attachments, approved US/AC, test cases, and AI QA notes. Always read the QA comments, because important late notes are often only there.
  4. Take the title from my prompt, not from the Trello list or a card. I will give you the plugin name, the version, and the release date, like this:
        Plugin Name: Multi-Carrier Shipping Plugin for WooCommerce
        Version 3.4.2 – Released: Aug 18th, 2026
      Use `# <Plugin Name>` as the first line, and put `Version 3.4.2 – Released: Aug 18th, 2026` on the line right after it. Pass only the plugin name to the PDF tool with `--title`. Keep my wording, version, and date exactly as I wrote them. Never invent or change a version or a date. Ask me once if I left one out.
  5. Find the platform for each card: WooCommerce, BigCommerce, Magento, or PrestaShop. Use WooCommerce if the card does not say. Use that platform's menu paths in the steps.
  6. Never mention feature flags or internal setup shorthand in the document. If a card needs something set up first — a newer plugin build, a setting to turn on, or a carrier registration done by hand — put it in that card's `Prerequisites` section in plain words, the way it reads on screen, with where to find it. Look everywhere in the card, not just the description: comments, checklists, attachments, the approved AC, the test cases, and the QA notes. Never guess. Write `Not stated in the card` and tell me about it. There is no prerequisite column in the index table.
  7. Use the exact layout in skills/woo-handoff-docs/references/handoff_doc_formats.md. The index table has three columns only: `Story Id`, `Title`, `Trello Card Link`. Each normal card section ends after Expected Behaviour. Do not bring back the sections or the columns we removed.
  8. Put no technical detail in the release overview or any normal card section. No code, class, or file names. No request, response, payload, or log field names. No node names, API, endpoint, schema, or hook references. No `Request node to verify:` callouts. No internal terms. Write it the way you would explain it to a person who has never seen the code: say what support sees on screen and what the merchant experiences. Write the Support Guide so a support person can explain the feature on a call. Keep the Business Brief short and safe for merchants, with no QA notes and no developer or tester names.
  9. Keep purely developer-only cards in a trailing `## Technical Cards` section. Put them there as `### <Story ID> - <Card title>` entries. Keep each entry to two to four lines: what changed and why it matters. Still list them in the index table in their normal place. If a card has both a technical part and something support can see, keep it as a normal card and leave the technical half out of the body.
  10. Do not make up owners, release numbers, versions, dates, prerequisites, or limits. If something is missing, say so and still give me a usable draft.
  11. Save the Markdown in data/handoff_docs/. Then make the PDF with skills/woo-handoff-docs/scripts/render_handoff_pdf.py. The PDF tool adds a page break before each card, so never add your own. Check that no card title is left alone at the bottom of a page.
  12. Send the doc to Slack only if I told you where to send it. Do a dry run first, then send with --yes in the same reply. Tell me where it went and the file id, or the exact error. A yes for a DM is not a yes for a channel.
  13. Use the other skills instead of doing their work yourself: woo-trello-operator to read cards and comments, woo-slack-operator to send messages, woo-domain-core to check current Woo facts, woo-feature-prerequisites to verify prerequisites when needed.
  14. Leave out any card carrying one of these labels: `SL: ON Hold`, `SL: Carrier Platform`, `Spill Over`, `SL: Closed By Support`. Match the label loosely, ignoring case and any emoji or prefix around it. Leave the card out of the index table too, not just the body. Include such a card only if I name it or tell you to include it. Always list the cards you left out and the label that caused it, so I can see the release is short on purpose.

  At the end, tell me which docs you made, the title, version and date you used, the full file paths, which cards you left out and why, what you assumed, and what was missing.
